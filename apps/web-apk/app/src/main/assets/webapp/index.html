<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./style.css">
<title>Crypto Strategy</title>
</head>
<body>
<div id="app">
  <header id="header">
    <div class="header-bg"></div>
    <div class="header-content">
      <div class="logo">⚡</div>
      <div class="title-wrap">
        <h1>Crypto Strategy</h1>
        <p class="subtitle">AI Builder &amp; Signal Scanner</p>
      </div>
      <div id="connection-status" class="pill offline">● Offline</div>
    </div>
    <div id="offline-banner" class="offline-banner hidden">📴 Mode offline — menampilkan data lokal/demo. Nyalakan backend untuk data live.</div>
  </header>

  <main id="main-content">
    <section id="tab-home" class="tab-content active"></section>
    <section id="tab-builder" class="tab-content"></section>
    <section id="tab-library" class="tab-content"></section>
    <section id="tab-backtest" class="tab-content"></section>
    <section id="tab-signals" class="tab-content"></section>
    <section id="tab-settings" class="tab-content"></section>
  </main>

  <nav id="tab-nav">
    <button class="tab active" data-tab="home"><span class="ico">🏠</span><span class="lbl">Home</span></button>
    <button class="tab" data-tab="builder"><span class="ico">🤖</span><span class="lbl">Builder</span></button>
    <button class="tab" data-tab="library"><span class="ico">📚</span><span class="lbl">Library</span></button>
    <button class="tab" data-tab="backtest"><span class="ico">📊</span><span class="lbl">Backtest</span></button>
    <button class="tab" data-tab="signals"><span class="ico">🔔</span><span class="lbl">Signals</span></button>
    <button class="tab" data-tab="settings"><span class="ico">⚙️</span><span class="lbl">AI</span></button>
  </nav>

  <div id="toast" class="toast hidden"></div>
  <div id="loading" class="loading-overlay hidden"><div class="spinner"></div><p>Memuat...</p></div>

  <!-- Confirm Modal -->
  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 id="modal-title">Konfirmasi</h3>
      <p id="modal-message">Apakah Anda yakin?</p>
      <div class="btn-row">
        <button id="modal-btn-cancel" class="btn btn-secondary">Batal</button>
        <button id="modal-btn-confirm" class="btn btn-danger">Hapus</button>
      </div>
    </div>
  </div>
</div>

<script src="./app.js"></script>
<script>
  if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROID_HOME: /home/runner/android-sdk
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo "8933bad1615424471e261948ee478d1e" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb65afcf100bb55b5adf" > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
          echo "24d29de81227b44856e1ea2c2d0cfd4d" > $ANDROID_SDK_ROOT/licenses/android.ndk-license
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          SDKMGR=$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/bin/sdkmanager
          yes | $SDKMGR --licenses 2>/dev/null || true
          printf 'y\n' | $SDKMGR "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" 2>/dev/null || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Pre-bundle JS
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-strategy-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

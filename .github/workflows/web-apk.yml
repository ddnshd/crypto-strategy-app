name: Build Web APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web-apk/**'
      - '.github/workflows/web-apk.yml'
jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROID_HOME: /home/runner/android-sdk
    defaults:
      run:
        working-directory: apps/web-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo "8933bad1615424471e261948ee478d1e" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb65afcf100bb55b5adf" > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          SDKMGR=$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/bin/sdkmanager
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo "24d29de81227b44856e1ea2c2d0cfd4d" > $ANDROID_SDK_ROOT/licenses/android.ndk-license
          yes | $SDKMGR --licenses 2>/dev/null || true
          $SDKMGR "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build APK
        run: ./gradlew assembleDebug --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-web-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
